<!DOCTYPE html>
<html>
<head>
  <title>데이터 입력</title>
</head>
<body>
  <h1>데이터 입력</h1>
  
  <textarea id="content" placeholder="내용을 입력하세요" rows="5" cols="40"></textarea>
  <br><br>
  
  <button onclick="saveData()">저장</button>
  <div id="message"></div>
  
  <hr>
  <button onclick="goToHome()">돌아가기</button>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = 'https://pbvhqzamtdekwsysrtjd.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_0BIOJge3BuvIbL1rIq...';
    
    const { createClient } = window.supabase;
    const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

    function saveData() {
      const content = document.getElementById('content').value;
      if (!content) {
        alert('내용을 입력하세요');
        return;
      }

      supabase
        .from('messages')
        .insert([{ content: content }])
        .then(({ data, error }) => {
          if (error) {
            document.getElementById('message').innerHTML = '❌ 저장 실패: ' + error.message;
          } else {
            document.getElementById('message').innerHTML = '✅ 저장 완료!';
            document.getElementById('content').value = '';
          }
        });
    }

    function goToHome() {
      window.location.href = 'index.html';
    }
  </script>
</body>
</html>
