<!DOCTYPE html>
<html>
<head>
  <title>데이터 입력</title>
</head>
<body>
  <h1>📝 데이터 입력</h1>
  
  <textarea id="content" placeholder="내용을 입력하세요" rows="5" cols="40"></textarea>
  <br><br>
  
  <button onclick="saveData()">저장</button>
  <button onclick="goHome()">돌아가기</button>
  
  <div id="message"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    // ⚠️ 여기에 당신의 정보를 입력하세요
    const SUPABASE_URL = 'https://rumino_data_base.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_0BlOJge3BuvIbL1rIq755A_Ybb3kjTU';
    
    const { createClient } = window.supabase;
    const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

    function saveData() {
      const content = document.getElementById('content').value;
      
      if (!content) {
        alert('내용을 입력하세요');
        return;
      }

      insertData(content);
    }

    async function insertData(content) {
      const { data, error } = await supabase
        .from('messages')
        .insert([{ content: content }]);

      if (error) {
        console.error('에러:', error);
        document.getElementById('message').innerHTML = '❌ 저장 실패: ' + error.message;
      } else {
        document.getElementById('message').innerHTML = '✅ 저장 완료!';
        document.getElementById('content').value = '';
      }
    }

    function goHome() {
      window.location.href = './index.html';
    }
  </script>
</body>
</html>
