<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>접근</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      font-family: Arial, sans-serif;
    }
    
    .login-container {
      background: white;
      padding: 40px;
      border-radius: 10px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
      text-align: center;
      width: 300px;
    }
    
    h1 {
      margin-bottom: 15px;
      color: #333;
      font-size: 28px;
    }
    
    p {
      margin-bottom: 30px;
      color: #666;
      font-size: 16px;
    }
    
    a {
      display: inline-block;
      width: 100%;
      padding: 12px;
      background: #667eea;
      color: white;
      text-decoration: none;
      border-radius: 5px;
      font-size: 16px;
      cursor: pointer;
      transition: background 0.3s;
      border: none;
      box-sizing: border-box;
    }
    
    a:hover {
      background: #764ba2;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <h1>🔐 환영합니다</h1>
    <p>시작하려면 클릭하세요</p>
    <a href="form.html">입장하기</a>
  </div>
</body>
</html>
