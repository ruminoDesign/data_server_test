<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>데이터 저장</title>
</head>

<body>
  <h1>데이터 저장 테스트</h1>

  <input
    type="text"
    id="content"
    placeholder="내용 입력"
  >

  <button id="saveBtn">저장</button>

  <hr>

  <h2>저장된 데이터:</h2>
  <div id="result">불러오는 중...</div>

  <button id="loadBtn">새로고침</button>


  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    // =========================
    // Supabase 설정
    // =========================

    const SUPABASE_URL =
      'https://pbvhqzamtdekwsysrtjd.supabase.co';

    const SUPABASE_KEY =
      'sb_publishable_0BlOJge3BuvIbL1rIq755A_Ybb3kjTU';


    // =========================
    // Supabase 연결
    // =========================

    const client = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


    // =========================
    // HTML 요소
    // =========================

    const contentInput = document.getElementById('content');
    const saveBtn = document.getElementById('saveBtn');
    const loadBtn = document.getElementById('loadBtn');
    const result = document.getElementById('result');


    // =========================
    // 데이터 저장
    // =========================

    async function saveData() {
      const text = contentInput.value.trim();

      if (!text) {
        alert('내용을 입력하세요.');
        contentInput.focus();
        return;
      }

      saveBtn.disabled = true;
      saveBtn.textContent = '저장 중...';

      try {
        const { error } = await client
          .from('messages')
          .insert([
            {
              content: text
            }
          ]);

        if (error) {
          console.error('저장 오류:', error);
          alert('저장 실패: ' + error.message);
          return;
        }

        alert('저장되었습니다!');

        contentInput.value = '';

        await loadData();

      } catch (error) {
        console.error('예상하지 못한 오류:', error);
        alert('오류가 발생했습니다.');
      } finally {
        saveBtn.disabled = false;
        saveBtn.textContent = '저장';
      }
    }


    // =========================
    // 데이터 불러오기
    // =========================

    async function loadData() {
      result.textContent = '불러오는 중...';

      try {
        const { data, error } = await client
          .from('messages')
          .select('*')
          .order('id', { ascending: false });

        if (error) {
          console.error('불러오기 오류:', error);
          result.textContent = '불러오기 실패: ' + error.message;
          return;
        }

        if (!data || data.length === 0) {
          result.textContent = '저장된 데이터가 없습니다.';
          return;
        }

        // XSS 방지를 위해 innerHTML 대신 DOM으로 생성
        result.innerHTML = '';

        data.forEach(item => {
          const p = document.createElement('p');
          p.textContent = item.content;
          result.appendChild(p);
        });

      } catch (error) {
        console.error('예상하지 못한 오류:', error);
        result.textContent = '오류가 발생했습니다.';
      }
    }


    // =========================
    // 버튼 이벤트
    // =========================

    saveBtn.addEventListener('click', saveData);

    loadBtn.addEventListener('click', loadData);


    // =========================
    // 페이지 처음 열 때 데이터 불러오기
    // =========================

    loadData();

  </script>
</body>
</html>
