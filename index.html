<!DOCTYPE html>
<html>
<head>
  <title>데이터 저장</title>
</head>
<body>
  <h1>데이터 저장 테스트</h1>
  
  <input type="text" id="content" placeholder="내용 입력">
  <button onclick="save()">저장</button>
  
  <hr>
  
  <h2>저장된 데이터:</h2>
  <div id="result"></div>
  
  <button onclick="load()">새로고침</button>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = 'https://pbvhqzamtdekwsysrtjd.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_0BlOJge3BuvIbL1rIq755A_Ybb3kjTU';
    
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    function save() {
      const text = document.getElementById('content').value;
      if (!text) { alert('입력하세요'); return; }
      
      supabase.from('messages').insert([{content: text}]).then(r => {
        if (r.error) alert('에러: ' + r.error.message);
        else { 
          alert('저장됨!'); 
          document.getElementById('content').value = '';
          load();
        }
      });
    }
    
    function load() {
      supabase.from('messages').select('*').then(r => {
        let html = '';
        r.data.forEach(d => html += '<p>' + d.content + '</p>');
        document.getElementById('result').innerHTML = html || '없음';
      });
    }
    
    load();
  </script>
</body>
</html>
